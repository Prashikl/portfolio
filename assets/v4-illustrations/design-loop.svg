<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Continuous design loop</title>
  <desc id="desc">Four connected stages show finding, mapping, making, and learning.</desc>
  <rect width="1000" height="1200" fill="#f4f0e8"/>
  <text x="64" y="76" fill="#151515" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="600" letter-spacing="4">A CONTINUOUS PRACTICE</text>
  <path d="M64 118h872" stroke="#151515" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="500" cy="610" r="332" fill="none" stroke="#151515" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 12"/>
  <path d="M500 278a332 332 0 0 1 332 332" fill="none" stroke="#58d8e6" stroke-width="18"/>
  <path d="M832 610a332 332 0 0 1-332 332" fill="none" stroke="#ff5c35" stroke-width="18"/>
  <path d="M500 942a332 332 0 0 1-332-332" fill="none" stroke="#ffb4dc" stroke-width="18"/>
  <path d="M168 610a332 332 0 0 1 332-332" fill="none" stroke="#d9f54a" stroke-width="18"/>
  <g stroke="#151515" stroke-width="4"><circle cx="500" cy="278" r="28" fill="#d9f54a"/><circle cx="832" cy="610" r="28" fill="#58d8e6"/><circle cx="500" cy="942" r="28" fill="#ff5c35"/><circle cx="168" cy="610" r="28" fill="#ffb4dc"/></g>
  <g font-family="Space Grotesk, sans-serif" fill="#151515">
    <text x="500" y="205" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">01 · FIND</text>
    <text x="890" y="617" font-size="18" font-weight="600" letter-spacing="2">02 · MAP</text>
    <text x="500" y="1025" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">03 · MAKE</text>
    <text x="42" y="617" font-size="18" font-weight="600" letter-spacing="2">04 · LEARN</text>
    <g transform="translate(340 455)"><rect width="320" height="310" fill="#fffdf8" stroke="#151515" stroke-width="3"/><text x="30" y="48" font-size="16" font-weight="600" letter-spacing="3">SYSTEM MODEL</text><path d="M30 78h260" stroke="#151515" stroke-opacity=".18"/><circle cx="82" cy="144" r="28" fill="#3255ff"/><circle cx="238" cy="144" r="28" fill="#d9f54a" stroke="#151515" stroke-width="3"/><path d="M110 144h100" stroke="#151515" stroke-width="4"/><rect x="30" y="210" width="260" height="58" fill="#151515"/><text x="160" y="246" fill="#fffdf8" font-size="17" font-weight="600" text-anchor="middle">TEST → LEARN → ADAPT</text></g>
  </g>
  <text x="64" y="1120" fill="#151515" font-family="Space Grotesk, sans-serif" font-size="34" font-weight="600">Ambiguity is material, not a blocker.</text>
</svg>